apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86":3, "x86_64":4]
ext.universalBase = 8000

android {
    namespace 'is.xyz.mpv'
    compileSdk = 37

    defaultConfig {
        applicationId "com.cineverse.app"
        minSdkVersion 23
        targetSdk 36

        versionCode 3
        versionName "1.1.0"

        vectorDrawables.useSupportLibrary = true

        // Load information about the NDK to use
        def props = new Properties()
        def propfile = new File(rootDir, 'ndk.properties')
        if (propfile.exists())
            props.load(new FileInputStream(propfile))
        ndkVersion = props.getProperty('ndkVersion', '')
        ndkPath = props.getProperty('ndkRoot', '')
    }

    flavorDimensions "default"
    productFlavors {
        "default" {
            isDefault true
        }
        allstorage {
            versionNameSuffix "-allstorage"
            minSdkVersion 30
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            // workaround: AGP fails to build split APKs and a bundle at the same time
            enable !gradle.startParameter.taskNames.any { it.startsWith("bundle") }

            reset()
            // include only the ABIs that were actually built
            project.ext.abiCodes.each { abi, _ ->
                if (new File(project.projectDir, "src/main/jniLibs/${abi}").exists())
                    include(abi)
            }
            universalApk true // build an APK with all ABIs too
        }
    }
}

// Map versionCode so each ABI gets a different one
// e.g. x86 with version 21 gets a versionCode of 3021
import com.android.build.api.variant.FilterConfiguration
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiName = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def base = project.ext.abiCodes[abiName]
            // universal APK just gets a constant added to it
            if (base != null)
                output.versionCode.set(output.versionCode.get() + base * 1000)
            else
                output.versionCode.set(output.versionCode.get() + project.ext.universalBase)
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'

    // Anime browser (Compose)
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
